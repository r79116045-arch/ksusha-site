backend:
  name: github
  repo: r79116045-arch/ksusha-site
  branch: main
  # OAuth App: https://github.com/settings/developers
  # Authorization callback URL: https://api.netlify.com/auth/done
  # Client ID вставить ниже (base_url оставить как есть для Netlify OAuth proxy)

publish_mode: editorial_workflow

media_folder: "blog/images"
public_folder: "/blog/images"

site_url: https://ксенияжуравлёва.рф
logo_url: https://ксенияжуравлёва.рф/ksusha-logo.png

locale: 'ru'

collections:
  - name: "blog"
    label: "Блог"
    files:
      - label: "Все статьи"
        name: "posts"
        file: "blog/posts.json"
        fields:
          - label: "Статьи"
            name: "posts"
            widget: "list"
            allow_add: true
            fields:
              - { label: "ID (латиница через дефис)", name: "id", widget: "string", required: true }
              - { label: "Заголовок", name: "title", widget: "string", required: true }
              - { label: "Дата", name: "date", widget: "date", format: "YYYY-MM-DD", required: true }
              - { label: "Теги", name: "tags", widget: "list", allow_add: true, required: false }
              - { label: "Анонс", name: "excerpt", widget: "text", required: true }
              - { label: "Текст статьи (Markdown)", name: "body", widget: "markdown", required: true }
              - { label: "Изображение", name: "image", widget: "image", required: false }
